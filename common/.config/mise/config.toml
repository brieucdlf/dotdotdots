# Source unique des versions d'outils, partagée par les deux machines.
# Un `mise install` suffit pour que Pop!_OS et Omarchy aient exactement les
# mêmes binaires — indépendamment d'apt et de pacman.
#
# Sur la machine Omarchy, les shims mise passent devant les binaires pacman.
# C'est voulu : c'est ce qui garantit l'iso.

[tools]
# runtimes
elixir = "latest"
erlang = "latest"
go = "latest"
java = "latest"
node = "lts"
"npm:pnpm" = "11.1.2"
python = "3.11"
ruby = "latest"

# CLI — le socle qui doit être identique partout
bat = "latest"
btop = "latest"
eza = "latest"
delta = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
starship = "latest"
zoxide = "latest"

# Chaîne de secrets. Épinglés au patch près, contrairement au reste : ce sont
# les seuls outils dont une régression casserait l'accès aux secrets plutôt
# qu'un simple confort de shell. La montée de version est un geste délibéré.
#
# age-plugin-yubikey reste en 0.5.0 SCIEMMENT : la 0.5.1 ne publie plus de
# binaire Linux (macOS et Windows seulement), et `latest` ferait donc échouer
# `mise install` sur les deux machines. À revoir quand Linux revient côté amont.
age = "1.3.1"
age-plugin-yubikey = "0.5.0"

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby"]

[settings.ruby]
compile = false
