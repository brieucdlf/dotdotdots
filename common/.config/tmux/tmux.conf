set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g mouse on

# prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# window / pane index starts at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# no escape delay (vim)
set -s escape-time 5

# splits
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# panneau Claude à gauche (agents en cours, quota, conso). S'ouvre tout seul
# dans les fenêtres qui font tourner Claude ; ce raccourci sert à replier,
# fermer, rouvrir — et refuse ailleurs.
bind-key a run-shell "~/.local/bin/tmux-claude-panel toggle"

# resize panes
bind-key -n C-M-j resize-pane -D 5
bind-key -n C-M-k resize-pane -U 5
bind-key -n C-M-h resize-pane -L 5
bind-key -n C-M-l resize-pane -R 5

# vim pane navigation
unbind-key j
unbind-key k
unbind-key h
unbind-key l
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

# clear history
bind -n C-b send-keys -R \; clear-history

# vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# window navigation
bind -n M-H previous-window
bind -n M-L next-window

# ── Statusbar (structure) ─────────────────────────────────────────────────────
# Les couleurs viennent de ~/.config/theme/current/tmux.conf, généré par
# theme/render.sh depuis colors.toml. Rien de codé en dur ici.
set -g status on
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 140
set -g status-interval 5

source-file -q ~/.config/theme/current/tmux.conf

# ── Plugins ──────────────────────────────────────────────────────────────────
# tpm vit dans ~/.config/tmux/plugins (XDG), pas dans ~/.tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"

run -b '~/.config/tmux/plugins/tpm/tpm'

# ── Startup layout ────────────────────────────────────────────────────────────
# Split todo à l'ouverture — seulement si ~/todo existe. Sans la garde, le `cd`
# échoue, le `&&` court-circuite, et il reste un pane vide à 35% de l'écran sur
# toute machine qui n'a pas le dossier (même logique que work.bash).
set-hook -g after-new-session \
  'if-shell "[ -d ~/todo ]" "split-window -h -l 35% ; send-keys \"cd ~/todo && claude\" Enter ; select-pane -t left"'
