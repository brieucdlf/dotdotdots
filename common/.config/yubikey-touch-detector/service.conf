# Lu par le service utilisateur yubikey-touch-detector (EnvironmentFile).
# Affiche une notification tant que la YubiKey attend une touche : signature
# SSH des commits, push vers GitHub, déchiffrement age.
#
# Noms valables à partir de la 1.14 : avant, NOTIFY s'appelait LIBNOTIFY. Les
# deux machines ont une version récente — pacman côté Omarchy, binaire amont
# côté Pop!_OS (voir install_touch_detector dans install.sh). Ubuntu 24.04 n'a
# pas de paquet, et celui qui arrive en 26.04 est une 1.12 : ces noms-là ne
# marcheraient pas avec.
#
# Référence : /usr/share/doc/yubikey-touch-detector/service.conf.example
YUBIKEY_TOUCH_DETECTOR_VERBOSE=false
YUBIKEY_TOUCH_DETECTOR_NOTIFY=true
YUBIKEY_TOUCH_DETECTOR_STDOUT=false
YUBIKEY_TOUCH_DETECTOR_NOSOCKET=false
