# Override ghostty spécifique à Pop!_OS — inclus par common/.config/ghostty/config
#
# background-opacity vaut 0.85 dans la config commune, calibré pour Hyprland,
# dont le looknfeel.conf floute derrière les fenêtres (blur size 12, passes 4).
# Le blur transforme la transparence en verre dépoli.
#
# COSMIC ne peut pas faire ça : cosmic-comp n'a aucune fonction de blur (ses
# seules clés sont active_hint, appearance_settings, autotile, xkb_config). Les
# `frosted_*` du thème sont rendus par libcosmic, donc ils ne s'appliquent qu'aux
# applications COSMIC — jamais à un client Wayland tiers comme ghostty.
#
# Sans blur derrière, 0.85 donne de la transparence brute et fatigue à la
# lecture. On remonte donc l'opacité ici plutôt que dans la config commune, pour
# ne pas dégrader le rendu de la machine pro qui, elle, a le blur.
#
# À ajuster librement : 1.0 = opaque, 0.85 = plus transparent.
background-opacity = 0.90
