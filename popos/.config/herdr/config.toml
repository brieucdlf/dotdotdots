# Configuration herdr — profil popos uniquement.
#
# Ce fichier ne porte QUE ce qui est propre à Pop!_OS. Les raccourcis, eux, sont
# communs aux deux machines et vivent dans `herdr/keys.toml` à la racine du
# dépôt : `dots-herdr-graft graft keys` les greffe ici comme chez Omarchy.
#
# Pourquoi pas dans `common/` : sur Omarchy, ce fichier appartient à la
# distribution (new_cwd, présentation, notifications viennent de son paquet), et
# herdr n'a pas de mécanisme d'include — c'est toute la raison d'être de
# `common/.local/bin/dots-herdr-graft`, qui GREFFE nos blocs dans le fichier
# d'Omarchy au lieu de le remplacer. Poser un config.toml commun écraserait le
# sien. Ici, sur Pop!_OS, personne ne le revendique : on l'écrit nous-mêmes.
#
# Copié par install.sh, PAS stowé (voir .stow-local-ignore) : dots-herdr-graft y
# greffe [theme] à chaque rendu et [keys] à chaque install, et
# `herdr config reset-keys` réécrit le fichier. Un lien serait remplacé par un
# fichier au premier de ces gestes.
# Corollaire : ce que tu édites à la main dans ~/.config/herdr/config.toml est
# écrasé au prochain install.sh. Édite ICI, ou dans herdr/keys.toml.
#
# [theme], [theme.custom] et [keys] sont volontairement absents : ils sont
# greffés, les deux premiers depuis theme/<nom>/ui.toml au moment du rendu.

[terminal]
# Même politique que tmux, dont tous les splits portaient
# `-c "#{pane_current_path}"` : un nouveau pane s'ouvre là où on était.
new_cwd = "follow"
