# Configuration herdr — profil popos uniquement.
#
# Pourquoi pas dans `common/` : sur Omarchy, ce fichier appartient à la
# distribution (prefix, raccourcis, new_cwd viennent de son paquet), et herdr
# n'a pas de mécanisme d'include — c'est toute la raison d'être de
# `common/.local/bin/dots-herdr-theme`, qui GREFFE le thème dans le fichier
# d'Omarchy au lieu de le remplacer. Poser un config.toml commun écraserait le
# sien. Ici, sur Pop!_OS, personne ne le revendique : on l'écrit en entier.
#
# Copié par install.sh, PAS stowé (voir .stow-local-ignore) : dots-herdr-theme
# y greffe le bloc [theme] à chaque rendu, et `herdr config reset-keys` réécrit
# le fichier. Un lien serait remplacé par un fichier au premier de ces gestes.
# Corollaire : ce que tu édites à la main dans ~/.config/herdr/config.toml est
# écrasé au prochain install.sh. Édite ICI.
#
# [theme] et [theme.custom] sont volontairement absents : ils sont greffés au
# moment du rendu depuis theme/<nom>/ui.toml.

[terminal]
# Même politique que tmux, dont tous les splits portaient
# `-c "#{pane_current_path}"` : un nouveau pane s'ouvre là où on était.
new_cwd = "follow"

[keys]
# ── Reprise des raccourcis tmux (common/.config/tmux/tmux.conf) ──────────────

# tmux : `unbind C-b ; set -g prefix C-Space`. herdr est justement livré avec
# ctrl+b — celui dont on s'était débarrassé.
prefix = "ctrl+space"

# tmux : `bind r source-file ~/.config/tmux/tmux.conf`. Le défaut herdr met
# reload_config sur prefix+shift+r et resize_mode sur prefix+r ; on les
# échange. resize_mode ne perd rien : les quatre raccourcis de
# redimensionnement directs ci-dessous rendent le mode dédié inutile.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux : `bind-key v split-window -h` (séparateur vertical, panes côte à côte)
#        `bind-key s split-window -v` (séparateur horizontal, panes empilés)
# herdr nomme le SÉPARATEUR, tmux nommait la DIRECTION du découpage — d'où
# l'inversion apparente des mots. Le geste, lui, est identique.
split_vertical = "prefix+v"
split_horizontal = "prefix+s"

# tmux : `bind-key h/j/k/l select-pane -L/-D/-U/-R`. Déjà les défauts herdr,
# écrits quand même : ce sont les touches qu'on tient à garder si un défaut
# amont change.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux : `bind-key -n C-M-h/j/k/l resize-pane -L/-D/-U/-R 5`. Sans préfixe là
# aussi. herdr laisse ces quatre-là vides par défaut.
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"

# tmux : `bind -n M-H previous-window` / `M-L next-window`. Les « windows » de
# tmux sont les tabs de herdr. Sans préfixe, comme dans tmux.
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"

# tmux : `set -g base-index 1` + le préfixe suivi d'un chiffre. Identique.
switch_tab = "prefix+1..9"
