# Tokens UI qui ne concernent QUE render.sh. Le partage avec colors.toml a
# changé de critère avec Omarchy 4 : son parser lit désormais n'importe quelle
# clé du colors.toml et l'expose aux gabarits, donc « Omarchy ne saurait pas la
# lire » n'est plus une raison de mettre une couleur ici. Ce qui reste : ce
# qu'Omarchy n'a aucune raison de voir — tmux, et la rampe COSMIC de Pop!_OS.
# Ne rien mettre ici qui existe déjà dans colors.toml : render.sh lit les deux
# fichiers dans la même table, un doublon y passerait inaperçu.

border_inactive = "#2a2e2a"   # bordure de pane tmux inactive — carbone froid
statusbar_bg    = "#0e100e"   # fond de barre tmux — carbone

# --- herdr --------------------------------------------------------------------
# Les couleurs sémantiques de herdr (surbrillances de statut, git, diagnostics).
# Elles NE peuvent PAS être les slots ANSI sombres : herdr les pose en avant-plan
# sur ses propres surfaces, dont la ligne sélectionnée (border_inactive). Sur
# cette palette, color4 y tombait à 1,00:1 — luminance identique, invisible —
# et color2 à 1,19:1. Toutes celles-ci tiennent ≥ 3:1 sur panel_bg, surface1 ET
# la ligne sélectionnée.
#
# Nurburgreen n'a que deux familles, le vert BRG et le cognac, là où herdr veut
# sept teintes distinctes : « blue » et « teal » restent donc deux verts. La
# première version les séparait de 0,2° de teinte et 3,2 de clarté — soit un
# ΔE de 11, que l'œil ne fait pas. Ils sont maintenant à ΔE 23, séparés pour de
# bon par la clarté, ce que ce commentaire prétendait déjà.
herdr_green    = "#0f8f4c"   # BRG en pleine lumière
herdr_teal     = "#35a37c"   # mousse claire
herdr_blue     = "#8ec7ac"   # menthe pâle — écartée du teal, voir plus bas

# Les FONDS de herdr : même correction que dans kreide. panel_bg et surface0
# étaient identiques, et active_row_bg ne se détachait pas du panneau (1,00:1).
herdr_panel_bg = "#0c100c"   # = color0, carbone
herdr_row_bg   = "#272d27"   # la ligne active, 1,36:1 sur le panneau
herdr_surface0 = "#121812"
herdr_surface1 = "#1a1e1a"   # = color8

herdr_overlay1 = "#aa9e92"   # ΔE 15 de subtext0 et 5,3:1 sur la ligne
                             # sélectionnée ; color13 y tombait à 2,7:1
herdr_yellow   = "#f5d020"   # = color11, distinct de accent (color3)
herdr_red      = "#c06a38"   # cognac au soleil
herdr_peach    = "#d99a5c"   # cognac clair
herdr_mauve    = "#b08a4a"   # cuir tan
herdr_overlay0 = "#9d8258"   # tan éteint — le cran le plus discret encore lisible

# --- COSMIC ------------------------------------------------------------------
# Rampe neutre : COSMIC construit tout son chrome (fonds de panneaux, boutons,
# séparateurs) sur neutral_0..10. Plutôt que de passer par neutral_tint, qui
# mélange une teinte de façon opaque, on donne la rampe complète : les trois
# premiers crans sont les carbones exacts de la palette (color0, color8,
# border_inactive), les suivants prolongent la même signature — canal vert
# légèrement au-dessus du rouge et du bleu — jusqu'au blanc.
cosmic_neutral_0  = "#000000"
cosmic_neutral_1  = "#0c100c"   # = color0
cosmic_neutral_2  = "#1a1e1a"   # = color8
cosmic_neutral_3  = "#2a2e2a"   # = border_inactive
cosmic_neutral_4  = "#454b45"
cosmic_neutral_5  = "#616861"
cosmic_neutral_6  = "#7e857e"
cosmic_neutral_7  = "#9ba39b"
cosmic_neutral_8  = "#bcc2bc"
cosmic_neutral_9  = "#dee1de"
cosmic_neutral_10 = "#ffffff"
cosmic_gray_1     = "#1a1e1a"
cosmic_gray_2     = "#262b26"
