# Nurburgreen — British Racing Green exact #004225
# Porsche 911 GT3 Touring / forêt / cuir cognac / étriers GT Yellow

# Pas de commentaire en fin de ligne sur ces clés : voir kreide.
# Porsche GT Yellow — étriers
accent               = "#f0c000"
# jaune vif
cursor               = "#f5d020"
# cuir cognac intérieur
foreground           = "#d4b88a"
# noir BRG profond (dérivé de #004225)
background           = "#001a0f"
selection_foreground = "#001a0f"
# BRG exact — sélection
selection_background = "#004225"

color0  = "#0c100c"   # black        — carbone sous lumière BRG
color1  = "#6b3a1f"   # red          — cognac sombre / écorce
color2  = "#004225"   # green        — British Racing Green EXACT
color3  = "#f0c000"   # yellow       — GT Yellow
color4  = "#0d3326"   # blue         — forêt profonde
color5  = "#5a3a1a"   # magenta      — cuir sombre
color6  = "#1d6648"   # cyan         — mousse forêt
color7  = "#b8a07a"   # white        — cognac muted

color8  = "#1a1e1a"   # br. black    — carbone teinté BRG
color9  = "#a06030"   # br. red      — cognac en plein soleil
color10 = "#0a6b38"   # br. green    — BRG en lumière directe
color11 = "#f5d020"   # br. yellow   — GT Yellow vif
color12 = "#2a5a3a"   # br. blue     — forêt claire
color13 = "#8a6835"   # br. magenta  — cuir tan
color14 = "#2d8060"   # br. cyan     — mousse claire
color15 = "#e0cba0"   # br. white    — reflet cuir clair

# --- Omarchy 4 ---------------------------------------------------------------
# Le moteur de gabarits d'Omarchy 4 expose TOUTE clé de ce fichier aux
# templates de default/themed/ ; il n'est plus limité aux noms du format
# standard. Ces deux-là sont lues par hyprland.lua.tpl (bordures de fenêtres)
# et par shell.toml.tpl, qui en dérive le liseré du verrouillage, des menus et
# des notifications. Les mettre ici plutôt que dans hypr/looknfeel.lua leur
# rend leur portée : elles appartiennent au thème, pas au compositeur.
hyprland_active_border   = "rgba(d4b88aff) rgba(8a6835ff) 45deg"   # cognac → cuir tan, 45°
hyprland_inactive_border = "rgba(1a1e1a66)"                        # carbone, très transparent

# Le rail du lanceur (plugin brieuc.launcher) — voir le même bloc dans kreide,
# et shell.launcher.toml.tpl pour ce qu'Omarchy en fait. color0 ne peut pas
# servir : le moteur le force à background avant de rendre les gabarits.
launcher_rail = "#0c100c"   # carbone

# --- Apps Omarchy (omacalc, omawrite, omacut) ---------------------------------
# Lues brutes par ces apps Qt, sans les replis d'omarchy-theme-color. Voir le
# même bloc dans kreide.
mode      = "dark"
# BRG exact, comme selection_background
selection = "#004225"
